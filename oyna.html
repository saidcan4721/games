<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Oyunu Oyna — Oyun Köşem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#101322;--ink:#f6f7ff;--muted:#a6abc3;--lime:#c8f169;--line:rgba(255,255,255,.1)}
    *{box-sizing:border-box}body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}h1,.brand{font-family:'Space Grotesk',sans-serif}a{color:inherit;text-decoration:none}
    .navbar{background:rgba(16,19,34,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--lime);color:#161a27;display:inline-grid;place-items:center;font-weight:800;margin-right:9px}.nav-link{color:#c5c9db!important;font-weight:600}.nav-link:hover{color:var(--lime)!important}
    .play-area{width:min(1100px,100%);margin:auto;padding:28px 16px 38px}.play-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.play-head h1{font-size:clamp(1.6rem,4vw,2.3rem);margin:0}.back-link{color:var(--lime);font-weight:800;white-space:nowrap}.game-frame{display:block;width:100%;height:min(78vh,820px);min-height:520px;border:1px solid var(--line);border-radius:20px;background:#080a12;box-shadow:0 22px 70px #0006}.hint{color:var(--muted);font-size:.9rem;margin:13px 2px 0}.footer{border-top:1px solid var(--line);color:var(--muted);padding:22px 0;font-size:.9rem}.footer strong{color:var(--ink)}
    .fullscreen-btn{border:1px solid var(--line);background:rgba(200,241,105,.1);color:var(--lime);border-radius:11px;padding:10px 14px;font:700 .9rem "DM Sans",sans-serif;white-space:nowrap}.fullscreen-btn:hover{background:var(--lime);color:#171b25}.play-area:fullscreen,.play-area:-webkit-full-screen{width:100vw;height:100vh;max-width:none;margin:0;padding:18px 24px 20px;background:var(--bg);overflow:auto;display:flex;flex-direction:column}.play-area:fullscreen .game-frame,.play-area:-webkit-full-screen .game-frame{flex:1;height:auto;min-height:0;max-height:none}
    @media(max-width:600px){.play-area{padding:20px 10px 28px}.play-head{align-items:flex-start}.game-frame{height:76vh;min-height:460px;border-radius:14px}}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark sticky-top"><div class="container py-2"><a class="navbar-brand brand fw-bold" href="index.html"><span class="brand-mark">▶</span>Oyun Köşem</a><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html#oyunlar">Tüm oyunlar</a><a class="nav-link" href="iletisim.html">İletişim</a></div></div></nav>
  <main class="play-area"><div class="play-head"><div><div class="text-uppercase small fw-bold" style="color:var(--lime);letter-spacing:.12em">Şimdi oynuyorsun</div><h1 id="gameTitle">Oyun</h1></div><div class="d-flex flex-wrap align-items-center gap-2"><button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-label="Tam ekrana geç">⛶ Tam ekran</button><a class="back-link" href="index.html#oyunlar">← Oyun listesine dön</a></div></div><iframe id="gameFrame" class="game-frame" title="Oyun alanı" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe><p class="hint">Oyun yüklenirken kısa bir süre bekleyebilirsin. Tam ekran düğmesini üstten kullan; çıkmak için aynı düğmeye bas.</p></main>
  <footer class="footer"><div class="container d-flex justify-content-between flex-wrap gap-2"><span>© 2026 <strong>Oyun Köşem</strong></span><span>Merakla yapıldı 💚</span></div></footer>
  <script>
    const shell=document.querySelector(".play-area"),fullscreenBtn=document.querySelector("#fullscreenBtn");
    function syncFullscreenButton(){const active=document.fullscreenElement===shell||document.webkitFullscreenElement===shell;fullscreenBtn.textContent=active?"⛶ Tam ekrandan çık":"⛶ Tam ekran";fullscreenBtn.setAttribute("aria-label",active?"Tam ekrandan çık":"Tam ekrana geç")}
    fullscreenBtn.addEventListener("click",async()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else document.webkitExitFullscreen?.()}else if(shell.requestFullscreen)await shell.requestFullscreen();else if(shell.webkitRequestFullscreen)shell.webkitRequestFullscreen()}catch{fullscreenBtn.title="Tam ekran bu tarayıcıda kullanılamıyor"}});document.addEventListener("fullscreenchange",syncFullscreenButton);document.addEventListener("webkitfullscreenchange",syncFullscreenButton);
    const games={nitro:{title:"Nitro Tünel",src:"games/nitro-tunnel/index.html"},"cyber-flappy":{title:"Cyber Flappy Ultimate",src:"games/cyber-flappy-ultimate/index.html"},"astro-strike":{title:"Astro Strike 3D",src:"games/astro-strike-3d/index.html"}};
    const game=games[new URLSearchParams(location.search).get("game")]||games.nitro;
    document.title=game.title+" — Oyun Köşem";
    document.querySelector("#gameTitle").textContent=game.title;
    document.querySelector("#gameFrame").src=game.src;
  </script>
</body>
</html>
